server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The change stream carries a one-minute single-use ticket in its query
    # string. Keep even that out of the access log.
    location ~ ^/api/v1/projects/[^/]+/stream$ {
        access_log off;
        proxy_pass http://api:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The project stream is Server-Sent Events: pass it through unbuffered
        # and let it stay open.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /health {
        proxy_pass http://api:4317/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
