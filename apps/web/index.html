<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Asten: a local-first writing desk with a memory. Your words in black. Our marks in red."
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f5eedf"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f1a2e"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/asten-192.png" />
    <link rel="apple-touch-icon" href="/icons/asten-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Asten" />
    <title>Asten</title>
    <script>
      try {
        var theme = localStorage.getItem("asten-theme");
        if (theme === "day" || theme === "night")
          document.documentElement.setAttribute("data-theme", theme);
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
