<!doctype html>
<html>
  <head>
    <base target="_top" />
    <style>
      body {
        margin: 12px;
        color: #26231f;
        background: #f6f4ef;
        font: 15px/1.5 Georgia, serif;
      }
      button, select { font: inherit; display: block; width: 100%; margin-top: 8px; }
      button {
        border: 1px solid #7a5c3e;
        background: #7a5c3e;
        color: #f6f4ef;
        padding: 8px 12px;
      }
      .quiet { color: #6f6a61; font: 13px/1.4 sans-serif; }
      pre { white-space: pre-wrap; font: 12px/1.4 monospace; }
    </style>
  </head>
  <body>
    <p>Asten is a Verne product. Docs is a guest.</p>
    <p class="quiet" id="status">Looking for the local API…</p>
    <label>
      Project
      <select id="project"></select>
    </label>
    <button type="button" id="refresh">Refresh diagnostics</button>
    <button type="button" id="file">File the selection</button>
    <ul id="problems"></ul>
    <pre id="out"></pre>
    <script>
      const API = "http://127.0.0.1:4317";
      const status = document.getElementById("status");
      const project = document.getElementById("project");
      const problems = document.getElementById("problems");
      const out = document.getElementById("out");

      function say(message) {
        status.textContent = message;
      }

      async function loadProjects() {
        const response = await fetch(API + "/api/v1/projects");
        if (!response.ok) throw new Error("The local API refused the project list.");
        const items = await response.json();
        project.replaceChildren();
        for (const item of items) {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = item.name;
          project.append(option);
        }
        say(items.length ? "Connected to Asten on this machine." : "The API is up. There is no project yet.");
      }

      async function loadDiagnostics() {
        if (!project.value) return;
        const response = await fetch(API + "/api/v1/projects/" + project.value + "/diagnostics");
        const items = await response.json();
        problems.replaceChildren();
        if (!Array.isArray(items) || !items.length) {
          say("No diagnostics.");
          return;
        }
        for (const item of items) {
          const line = document.createElement("li");
          line.textContent = item.code + " — " + item.message;
          problems.append(line);
        }
        say(items.length + " diagnostics.");
      }

      function readSelection() {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .selectedText();
        });
      }

      async function fileSelection() {
        const text = String(await readSelection() || "").trim();
        if (!text) {
          say("Select prose in the document first.");
          return;
        }
        const response = await fetch(API + "/api/v1/projects/" + project.value + "/import", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            filename: "From Docs",
            format: "plain",
            body: text,
            kind: "scene",
          }),
        });
        out.textContent = await response.text();
        if (!response.ok) {
          say("Asten did not file the selection.");
          return;
        }
        say("Filed into the local project.");
        await loadDiagnostics();
      }

      document.getElementById("refresh").onclick = () => loadDiagnostics().catch((error) => say(error.message));
      document.getElementById("file").onclick = () => fileSelection().catch((error) => say(error.message));
      loadProjects().catch((error) => {
        say(error.message + " The browser may be blocking a public page from calling 127.0.0.1. The API must answer Access-Control-Allow-Private-Network.");
      });
    </script>
  </body>
</html>
