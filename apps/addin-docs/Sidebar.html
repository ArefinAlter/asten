<!doctype html>
<html>
  <head>
    <base target="_top" />
    <style>
      :root { --paper: #f4ecd8; --ink: #141210; --ink-soft: #5b544b; --rubric: #a3261b; --rule: #d9cdb0; }
      body { margin: 12px; color: var(--ink); background: var(--paper); font: 15px/1.5 Georgia, serif; }
      button, select, input { font: inherit; display: block; width: 100%; margin-top: 8px; box-sizing: border-box; }
      input, select { padding: 8px 10px; border: 1px solid var(--rule); background: #fffdf7; color: var(--ink); }
      input.code { font: 22px/1.2 monospace; letter-spacing: 0.3em; text-align: center; }
      button { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); padding: 8px 12px; cursor: pointer; }
      button.quiet-button { background: transparent; color: var(--ink); }
      button.rubric { background: transparent; color: var(--rubric); border-color: transparent; text-align: left; width: auto; padding: 0; margin-top: 12px; font-size: 13px; }
      .quiet { color: var(--ink-soft); font: 13px/1.4 sans-serif; }
      .mono { font: 13px/1.4 monospace; }
      pre { white-space: pre-wrap; font: 12px/1.4 monospace; }
      ul { padding-left: 0; list-style: none; }
      li { margin: 10px 0; padding-left: 10px; border-left: 2px solid var(--rule); }
      li.error { border-left-color: var(--rubric); }
      li .code { color: var(--rubric); }
      [hidden] { display: none !important; }
      hr { border: 0; border-top: 1px solid var(--rule); margin: 16px 0; }
    </style>
  </head>
  <body>
    <p>Asten is a Verne product. Docs is a guest.</p>
    <p class="quiet" id="status">Looking for the local desk…</p>

    <section id="pairing" hidden>
      <p class="quiet">The desk answers only to clients you have paired. In the Asten desk open <em>Guests</em> → <em>Show a code</em>, or read the code the API printed when it started, and type it here once.</p>
      <label>Pairing code<input id="code" class="code" inputmode="numeric" maxlength="7" placeholder="000 000" /></label>
      <label>Where is the desk?<input id="origin" class="mono" value="http://127.0.0.1:4317" /></label>
      <button type="button" id="pair">Pair this Doc</button>
    </section>

    <section id="desk" hidden>
      <label>Project<select id="project"></select></label>
      <button type="button" id="refresh">Refresh the Scales</button>
      <button type="button" class="quiet-button" id="file">File the selection as a scene</button>
      <ul id="problems"></ul>
      <pre id="out"></pre>
      <hr />
      <button type="button" class="rubric" id="forget">Forget this pairing</button>
    </section>

    <script>
      const status = document.getElementById("status");
      const pairing = document.getElementById("pairing");
      const desk = document.getElementById("desk");
      const project = document.getElementById("project");
      const problems = document.getElementById("problems");
      const out = document.getElementById("out");
      const codeInput = document.getElementById("code");
      const originInput = document.getElementById("origin");
      let session = null; // { origin, token }

      function say(message) {
        status.textContent = message;
      }
      function script(name) {
        const args = Array.prototype.slice.call(arguments, 1);
        return new Promise((resolve, reject) => {
          const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
          runner[name].apply(runner, args);
        });
      }
      function trimSlash(value) {
        return value.endsWith("/") ? value.slice(0, -1) : value;
      }
      function api() {
        return trimSlash((session && session.origin) || originInput.value || "http://127.0.0.1:4317");
      }

      class Unauthorized extends Error {}

      async function call(path, init) {
        const headers = Object.assign({ accept: "application/json" }, (init && init.headers) || {});
        if (session && session.token) headers.authorization = "Bearer " + session.token;
        const response = await fetch(api() + "/api/v1" + path, Object.assign({}, init, { headers }));
        if (response.status === 401) throw new Unauthorized("This Doc is not paired with the desk.");
        return response;
      }

      function showPairing(message) {
        pairing.hidden = false;
        desk.hidden = true;
        if (message) say(message);
      }
      function showDesk() {
        pairing.hidden = true;
        desk.hidden = false;
      }

      async function pair() {
        const code = codeInput.value.replace(/[^0-9]/g, "");
        if (code.length !== 6) {
          say("The code has six digits.");
          return;
        }
        const origin = trimSlash(originInput.value.trim());
        const response = await fetch(origin + "/api/v1/auth/pair", {
          method: "POST",
          headers: { "content-type": "application/json", accept: "application/json" },
          body: JSON.stringify({ code: code, label: "Google Docs sidebar" }),
        });
        if (!response.ok) {
          say(
            response.status === 401
              ? "That code was not accepted. Codes work once and expire after ten minutes."
              : "The desk refused the pairing (" + response.status + ").",
          );
          return;
        }
        const paired = await response.json();
        session = { origin: origin, token: paired.token };
        await script("savePairing", session);
        codeInput.value = "";
        await loadProjects();
      }

      async function forget() {
        try {
          await call("/auth/logout", { method: "POST" });
        } catch (_) {
          /* the token may already be gone */
        }
        session = null;
        await script("forgetPairing");
        problems.replaceChildren();
        out.textContent = "";
        showPairing("Pairing forgotten. The desk will no longer answer this sidebar.");
      }

      async function loadProjects() {
        const response = await call("/projects");
        if (!response.ok) throw new Error("The desk refused the project list.");
        const items = await response.json();
        project.replaceChildren();
        for (const item of items) {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = item.name;
          project.append(option);
        }
        showDesk();
        say(items.length ? "Paired with the desk on this machine." : "Paired. There is no project yet; make one in the desk.");
      }

      async function loadDiagnostics() {
        if (!project.value) {
          say("Choose a project.");
          return;
        }
        const response = await call("/projects/" + project.value + "/story/diagnostics");
        if (!response.ok) throw new Error("The desk could not weigh this project.");
        const snapshot = await response.json();
        const all = Array.isArray(snapshot) ? snapshot : snapshot.diagnostics || [];
        const items = all.filter((mark) => !mark.suppressed_by);
        problems.replaceChildren();
        if (!items.length) {
          say("The Scales are level. Nothing to weigh.");
          return;
        }
        for (const item of items) {
          const line = document.createElement("li");
          line.className = item.severity || "";
          const code = document.createElement("span");
          code.className = "code mono";
          code.textContent = item.code + " ";
          const msg = document.createElement("span");
          msg.textContent = item.message;
          line.append(code, msg);
          problems.append(line);
        }
        say(items.length + (items.length === 1 ? " mark." : " marks.") + " Repairs live in the desk.");
      }

      async function fileSelection() {
        const text = String((await script("selectedText")) || "").trim();
        if (!text) {
          say("Select prose in the document first.");
          return;
        }
        if (!project.value) {
          say("Choose a project.");
          return;
        }
        const response = await call("/projects/" + project.value + "/import", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ filename: "From Docs", format: "plain", body: text, kind: "scene" }),
        });
        const body = await response.text();
        out.textContent = response.ok ? "" : body;
        if (!response.ok) {
          say("Asten did not file the selection.");
          return;
        }
        say("Filed into the local project.");
        await loadDiagnostics();
      }

      function guard(task) {
        return () =>
          task().catch((error) => {
            if (error instanceof Unauthorized) {
              session = null;
              script("forgetPairing").catch(() => {});
              showPairing(error.message);
            } else {
              say(error.message || String(error));
            }
          });
      }

      document.getElementById("pair").onclick = guard(pair);
      document.getElementById("refresh").onclick = guard(loadDiagnostics);
      document.getElementById("file").onclick = guard(fileSelection);
      document.getElementById("forget").onclick = guard(forget);
      codeInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") guard(pair)();
      });

      async function boot() {
        try {
          session = await script("loadPairing");
        } catch (_) {
          session = null;
        }
        if (session && session.origin) originInput.value = session.origin;
        let up = false;
        try {
          up = (await fetch(api() + "/health")).ok;
        } catch (_) {
          up = false;
        }
        if (!up) {
          showPairing(
            "No desk is answering at " +
              api() +
              ". Open Asten or start the API, then pair. Chrome may also ask you to allow this sidebar to reach devices on your local network; if it never asks and never connects, file the scene from the desk instead.",
          );
          return;
        }
        if (!session || !session.token) {
          showPairing("The desk is up. Pair this Doc once.");
          return;
        }
        await loadProjects();
      }

      guard(boot)();
    </script>
  </body>
</html>
