[package]
name = "asten-desktop"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# The Tauri convention: a distinct library name so the binary and the
# library do not collide. Desktop links the rlib; Android needs a cdylib and
# iOS a staticlib.
name = "asten_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
asten-api = { path = "../../../services/asten-api" }
asten-application = { path = "../../../crates/asten-application" }
asten-domain = { path = "../../../crates/asten-domain" }
asten-storage = { path = "../../../crates/asten-storage" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tauri.workspace = true
tauri-plugin-process.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

# Desktop only: phones update through their store and cannot run two copies
# of an app, so neither plugin exists for Android or iOS.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
asten-assistant = { path = "../../../crates/asten-assistant" }
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true

[build-dependencies]
tauri-build.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
