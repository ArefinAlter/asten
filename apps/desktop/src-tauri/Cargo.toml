[package]
name = "asten-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# The Tauri convention: a distinct library name so the binary and the
# library do not collide. Desktop links the rlib; Android needs a cdylib and
# iOS a staticlib.
name = "asten_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
asten-api = { path = "../../../services/asten-api" }
asten-application = { path = "../../../crates/asten-application" }
asten-domain = { path = "../../../crates/asten-domain" }
asten-storage = { path = "../../../crates/asten-storage" }
serde = { workspace = true }
tauri.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
tauri-build.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
