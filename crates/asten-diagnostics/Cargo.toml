[package]
name = "asten-diagnostics"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Diagnostic codes, records, computed severities, explanations, repairs and evidence-bound suppressions for the Asten canon engine."

[dependencies]
ts-rs = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
asten-ir = { path = "../asten-ir" }
serde.workspace = true
serde_json.workspace = true

[features]
# Export TypeScript bindings for the API contracts (`pnpm contracts:gen`).
ts = ["dep:ts-rs", "asten-ir/ts"]
# Derive OpenAPI schemas for the API contracts (`node scripts/openapi-export.mjs`).
openapi = ["dep:utoipa", "asten-ir/openapi"]
