[package]
name = "asten-blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Asten's block model: stable block ids, rich-text patches, a hash-chained event log, snapshots, three-way merge, anchor mapping and blame. Shaped after the MIT dynodoc-engine."

[dependencies]
ts-rs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ulid.workspace = true

[features]
# Export TypeScript bindings for the API contracts (`pnpm contracts:gen`).
ts = ["dep:ts-rs"]

[dev-dependencies]
proptest.workspace = true
