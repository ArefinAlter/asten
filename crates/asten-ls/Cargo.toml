[package]
name = "asten-ls"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The story language server protocol: the request and notification shapes shared by the desk, the Word pane, the Docs sidebar and the API."

[dependencies]
ts-rs = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
asten-diagnostics = { path = "../asten-diagnostics" }
asten-ir = { path = "../asten-ir" }
serde.workspace = true
serde_json.workspace = true

[features]
# Export TypeScript bindings for the API contracts (`pnpm contracts:gen`).
ts = ["dep:ts-rs", "asten-ir/ts", "asten-diagnostics/ts"]
# Derive OpenAPI schemas for the API contracts (`node scripts/openapi-export.mjs`).
openapi = ["dep:utoipa", "asten-ir/openapi", "asten-diagnostics/openapi"]
