[package]
name = "asten-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
ts-rs = { workspace = true, optional = true }
asten-auth = { path = "../asten-auth" }
asten-blocks = { path = "../asten-blocks" }
asten-diagnostics = { path = "../asten-diagnostics" }
asten-domain = { path = "../asten-domain" }
asten-engine = { path = "../asten-engine" }
asten-ir = { path = "../asten-ir" }
asten-ls = { path = "../asten-ls" }
asten-perceive = { path = "../asten-perceive" }
asten-time = { path = "../asten-time" }
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
tracing.workspace = true
uuid.workspace = true
quick-xml.workspace = true
zip.workspace = true

[features]
# Export TypeScript bindings for the API contracts (`pnpm contracts:gen`).
ts = ["dep:ts-rs", "asten-auth/ts", "asten-blocks/ts", "asten-diagnostics/ts", "asten-domain/ts", "asten-ir/ts", "asten-ls/ts", "asten-time/ts"]
