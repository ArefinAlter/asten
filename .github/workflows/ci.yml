name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Root scripts also cargo-check the Tauri shell. That crate needs GTK,
      # so the desktop job checks it on Windows instead.
      - run: pnpm -r format:check
      - run: pnpm -r check
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm --filter @asten/web build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --all -- --check
      # Every crate except the Tauri shell, which needs GTK and is checked on Windows below.
      - run: cargo clippy --workspace --exclude asten-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude asten-desktop
      # The TypeScript contracts are generated from the Rust types; the committed
      # output must match, and src/drift.ts (checked by the frontend job) keeps
      # the handwritten contracts in step with it.
      - run: node scripts/contracts-gen.mjs
      - run: git diff --exit-code -- packages/contracts/src/generated

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @asten/web build
      - run: cargo check -p asten-desktop
