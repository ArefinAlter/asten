name: CI

on:
  push:
  pull_request:
  # The macOS shell check bills at ten times the Linux rate, so it runs on a
  # weekly schedule and on demand rather than on every push. Release builds
  # always include macOS.
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r format:check
      - run: pnpm -r check
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm --filter @asten/web build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --all -- --check
      # Every crate except the Tauri shell, which needs GTK and is checked on Windows below.
      - run: cargo clippy --workspace --exclude asten-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude asten-desktop
      # The TypeScript contracts are generated from the Rust types; the committed
      # output must match, and src/drift.ts (checked by the frontend job) keeps
      # the handwritten contracts in step with it.
      - run: node scripts/contracts-gen.mjs
      - run: git diff --exit-code -- packages/contracts/src/generated

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '["windows-latest", "ubuntu-latest", "macos-latest"]' || '["windows-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev             librsvg2-dev patchelf libxdo-dev libssl-dev build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @asten/web build
      - run: cargo check -p asten-desktop
