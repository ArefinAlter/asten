[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/asten-application",
  "crates/asten-assistant",
  "crates/asten-auth",
  "crates/asten-blocks",
  "crates/asten-diagnostics",
  "crates/asten-domain",
  "crates/asten-engine",
  "crates/asten-ir",
  "crates/asten-logic",
  "crates/asten-ls",
  "crates/asten-perceive",
  "crates/asten-storage",
  "crates/asten-time",
  "services/asten-api",
  "services/asten-prealpha",
]

[workspace.package]
version = "0.0.1-alpha"
license = "MIT"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
http = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "chrono"] }
tauri = "2.8"
tauri-build = "2.4"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "cors", "fs", "request-id", "set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v7"] }
base64 = "0.22"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
sha2 = "0.10"
ulid = "1"
aho-corasick = "1.1"
unicode-segmentation = "1.12"
unicode-normalization = "0.1"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.9"
subtle = "2.6"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
hex = "0.4"
proptest = "1.5"
ts-rs = { version = "12", features = ["serde-compat", "chrono-impl", "uuid-impl", "serde-json-impl", "no-serde-warnings"] }
chacha20poly1305 = "0.10"
keyring = "4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
tokio-util = "0.7"
url = "2"
zeroize = "1"
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid", "preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
