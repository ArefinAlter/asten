services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/asten-api/Dockerfile
    environment:
      ASTEN_BIND: 0.0.0.0:4317
      ASTEN_DATABASE_PATH: /app/data/asten.db
      RUST_LOG: asten_api=info,tower_http=info
    ports:
      - "4317:4317"
    volumes:
      - asten-data:/app/data
    restart: unless-stopped

volumes:
  asten-data:
