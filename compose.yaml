services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/margin-api/Dockerfile
    environment:
      MARGIN_BIND: 0.0.0.0:4317
      MARGIN_DATABASE_PATH: /app/data/margin.db
      RUST_LOG: margin_api=info,tower_http=info
    ports:
      - "4317:4317"
    volumes:
      - margin-data:/app/data
    restart: unless-stopped

volumes:
  margin-data:
