# /etc/nginx/sites-available/asten-prealpha on the shared VPS.
# TLS for asten.103.191.50.32.sslip.io; everything goes to 127.0.0.1:18640.
limit_req_zone $binary_remote_addr zone=asten_prealpha:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=asten_prealpha_svc:10m rate=240r/m;

server {
    listen 80;
    listen [::]:80;
    server_name asten.103.191.50.32.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/asten-prealpha-acme; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asten.103.191.50.32.sslip.io;
    ssl_certificate /etc/letsencrypt/live/asten.103.191.50.32.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asten.103.191.50.32.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 10m;
    limit_req_status 429;
    access_log /var/log/nginx/asten-prealpha/access.log;
    error_log /var/log/nginx/asten-prealpha/error.log;

    # No HSTS on an sslip.io name. The gateway and the API set the rest.
    proxy_hide_header X-Robots-Tag;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location ~ ^/api/v1/projects/[^/]+/stream$ {
        limit_req zone=asten_prealpha burst=40 nodelay;
        proxy_pass http://127.0.0.1:18640;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /svc/ {
        limit_req zone=asten_prealpha_svc burst=60 nodelay;
        proxy_pass http://127.0.0.1:18640;
    }

    location / {
        limit_req zone=asten_prealpha burst=200 nodelay;
        proxy_pass http://127.0.0.1:18640;
    }
}
