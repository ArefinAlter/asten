# Inside the compose project: forward everything to the gateway. The host's
# nginx (asten-prealpha.site.conf) terminates TLS and rate-limits first.
server {
    listen 8080;
    server_tokens off;
    # The host nginx keeps the only access log (rotated, 14 days).
    access_log off;
    client_max_body_size 10m;
    location / {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # The change stream is Server-Sent Events.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
